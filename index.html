<!DOCTYPE html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Without this the full URL of the page being read is handed to
         googletagmanager.com and to api.web3forms.com on every request. The
         origin alone is all either one needs.

         The other half of this, the Content-Security-Policy, is injected at
         build time instead of living here — see the `csp` plugin in
         vite.config.ts for why, and for what it does and does not cover. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>Bookkeeping for BC Small Business | Orbis Accounting</title>
    <meta
      name="description"
      content="Fixed monthly bookkeeping for BC small business, from West Vancouver. GST and PST both filed. Three plans sized to your transaction volume, with a written quote in one business day."
    />
    <meta name="theme-color" content="#0A0C0A" />

    <!-- Real files, not a data URI: Google only shows a site icon in search
         results if it can crawl one at a URL. Sources: public/favicon.svg. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Bookkeeping for BC Small Business | Orbis Accounting" />
    <meta
      property="og:description"
      content="Fixed monthly bookkeeping for BC small business, from West Vancouver. GST and PST both filed. A written plan and a price within one business day."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.orbisaccounting.ca/" />
    <meta property="og:site_name" content="Orbis Accounting" />
    <!-- Both are rewritten per route by scripts/prerender.mjs, which swaps them
         on the /zh/ URLs. The pair has to exist here for that to have something
         to rewrite — the script throws rather than leave a route carrying the
         home page's metadata. Facebook's locale list has no zh_CA, so the
         Chinese pages declare zh_CN. -->
    <meta property="og:locale" content="en_CA" />
    <meta property="og:locale:alternate" content="zh_CN" />
    <meta property="og:image" content="https://www.orbisaccounting.ca/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Orbis Accounting — bookkeeping for BC small business, West Vancouver"
    />

    <!-- X/Twitter, LinkedIn and iMessage fall back to the og: tags above for
         title, description and image, so only the card type is needed here. -->
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="canonical" href="https://www.orbisaccounting.ca/" />

    <!-- Language alternates, injected per route by scripts/prerender.mjs. -->
    <!--hreflang-->

    <!-- Fonts are self-hosted (scripts/fetch-fonts.mjs), so there is no
         third-party stylesheet on the critical path. Only the face used by the
         largest above-the-fold text is preloaded; the rest load with the CSS.
         crossorigin is required even same-origin, or the fetch is duplicated. -->
    <link
      rel="preload"
      href="/fonts/instrument-serif-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Injected per route by scripts/prerender.mjs. -->
    <!--structured-data-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
