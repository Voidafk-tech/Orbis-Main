name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual runs exist for one job: announcing every URL to IndexNow rather than
  # only the ones this commit changed. See the `notify` job, and the note on
  # `--all` in scripts/indexnow.mjs. Re-deploying in order to do it is harmless
  # — the build is deterministic and Pages accepts the same artifact again.
  workflow_dispatch:
    inputs:
      submit_all:
        description: 'Announce every sitemap URL to IndexNow, not just changed ones'
        type: boolean
        default: false

# Nothing by default; each job takes only what it needs.
#
# This used to be one block granting `pages: write` and `id-token: write` to
# both jobs, which meant the build job held them while running `npm ci` —
# and `npm ci` executes whatever install scripts the dependency tree carries.
# A single compromised transitive package could have used that token to mint an
# OIDC identity or publish to Pages. The build job installs and produces an
# artifact; the deploy job publishes it and installs nothing. Splitting the
# grants along that line costs nothing and removes the overlap.
permissions: {}

# Pages accepts one deployment at a time. Without this, a burst of pushes —
# uploading a file through the web UI, deleting it, uploading it again — fires
# overlapping runs that queue against each other, and the failure mode is a run
# that sits there rather than one that says what is wrong.
#
# `cancel-in-progress: false` on purpose: a half-finished deploy-pages should be
# allowed to land. Killing it mid-publish is how the Pages deployment gets stuck
# in a state no later run can clear.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The real build is about twenty seconds. The default limit is six hours,
    # which is not a limit — two deploys have already been cancelled after
    # fifteen minutes without ever being assigned a runner, and a job that never
    # starts looks identical to one that is merely slow. Ten minutes turns that
    # into a fast, obvious failure instead of a silent stall.
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: `@v4` is a promise
      # from whoever can move it rather than a fixed piece of code, and moving
      # one is how a compromised action reaches every workflow using it. The
      # version in the trailing comment is what Dependabot reads when it bumps
      # these — see .github/dependabot.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the sitemap's `lastmod` is the date of the
          # last commit touching each route's sources — see scripts/lastmod.mjs.
          # The default here is depth 1, and over a single commit every file
          # reports that commit's date: eighteen identical dates that look like
          # real ones. The script refuses to run shallow in CI rather than
          # publish that, so removing this line fails the build.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # react-router 8 requires >=22.22.0.
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 'ci', not 'install': the deploy must get the exact versions the
        # lockfile pins, or a transitive bump can ship an unreviewed package.
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  # Tells IndexNow — Bing, Yandex, Seznam, Naver, Yep — which URLs this deploy
  # changed. Not Google, which does not participate in the protocol.
  #
  # A third job rather than a step on either of the two above, for reasons that
  # are the same ones that split those two in the first place:
  #
  #   - It has to run *after* the files are live, because the protocol verifies
  #     ownership by fetching the key file from the site. That rules out the
  #     build job.
  #   - It must not run inside the job holding `pages: write` and
  #     `id-token: write`. Announcing to a third-party endpoint from a job with
  #     publish rights is the overlap the permissions split exists to avoid.
  #
  # It installs nothing — no `npm ci`, no dependencies — and reads the deployed
  # sitemap over HTTPS instead of the build artifact, so `contents: read` for
  # the script itself is the whole of what it needs.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Pinned to a commit for the same reason as the jobs above.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Depth 1 on purpose, unlike the build job: this reads only
        # scripts/indexnow.mjs, public/CNAME, the key file, and HEAD's own
        # commit date. None of that needs history, and the sitemap dates it
        # compares against were already written by a full-history build.

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
        # No `cache: npm`: nothing is installed, so there is nothing to cache.

      - name: Notify IndexNow
        run: node scripts/indexnow.mjs ${{ inputs.submit_all && '--all' || '' }}
