name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

# Nothing by default; each job takes only what it needs.
#
# This used to be one block granting `pages: write` and `id-token: write` to
# both jobs, which meant the build job held them while running `npm ci` —
# and `npm ci` executes whatever install scripts the dependency tree carries.
# A single compromised transitive package could have used that token to mint an
# OIDC identity or publish to Pages. The build job installs and produces an
# artifact; the deploy job publishes it and installs nothing. Splitting the
# grants along that line costs nothing and removes the overlap.
permissions: {}

# Pages accepts one deployment at a time. Without this, a burst of pushes —
# uploading a file through the web UI, deleting it, uploading it again — fires
# overlapping runs that queue against each other, and the failure mode is a run
# that sits there rather than one that says what is wrong.
#
# `cancel-in-progress: false` on purpose: a half-finished deploy-pages should be
# allowed to land. Killing it mid-publish is how the Pages deployment gets stuck
# in a state no later run can clear.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The IndexNow payload is computed here, where the repo and its git history
    # are checked out, and POSTed from the deploy job, which has neither. Passing
    # it as a job output is what avoids a second checkout and a second npm ci
    # just to send one request.
    outputs:
      indexnow: ${{ steps.indexnow.outputs.payload }}
    # The real build is about twenty seconds. The default limit is six hours,
    # which is not a limit — two deploys have already been cancelled after
    # fifteen minutes without ever being assigned a runner, and a job that never
    # starts looks identical to one that is merely slow. Ten minutes turns that
    # into a fast, obvious failure instead of a silent stall.
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag. A tag is mutable: `@v4` is a promise
      # from whoever can move it rather than a fixed piece of code, and moving
      # one is how a compromised action reaches every workflow using it. The
      # version in the trailing comment is what Dependabot reads when it bumps
      # these — see .github/dependabot.yml.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because the sitemap's `lastmod` is the date of the
          # last commit touching each route's sources — see scripts/lastmod.mjs.
          # The default here is depth 1, and over a single commit every file
          # reports that commit's date: eighteen identical dates that look like
          # real ones. The script refuses to run shallow in CI rather than
          # publish that, so removing this line fails the build.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # react-router 8 requires >=22.22.0.
          node-version: 22
          cache: npm

      - name: Install dependencies
        # 'ci', not 'install': the deploy must get the exact versions the
        # lockfile pins, or a transitive bump can ship an unreviewed package.
        run: npm ci

      - name: Build
        run: npm run build

      # Reads dist/sitemap.xml, so it has to follow the build. Prints nothing at
      # all when no route changed in this commit, which leaves the job output
      # empty and skips the submission step below.
      - name: Collect changed URLs for IndexNow
        id: indexnow
        env:
          # The commit this push started from. The script needs the whole range,
          # not just HEAD, because a merge commit is dated later than the branch
          # commits it brings in — see the note on deployDates() in the script.
          INDEXNOW_SINCE: ${{ github.event.before }}
        run: node scripts/indexnow.mjs >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # After the deploy, never before it. The API fetches the key file from the
      # live site to prove we control the domain, so submitting first means
      # submitting against whatever the previous deploy published — and on the
      # very first run, against a key file that does not exist yet.
      #
      # Skipped entirely when the build job found no changed route, which is the
      # normal case for a deploy that only touched the README.
      #
      # continue-on-error because by this point the site is already published:
      # Bing being down is not a reason to paint a successful deploy red. It
      # still surfaces as a failed step, so a genuinely broken key does not go
      # unnoticed.
      - name: Submit changed URLs to IndexNow
        if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD"
